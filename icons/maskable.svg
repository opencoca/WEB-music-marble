<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="marble" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.35">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#8b0000"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed background: platform masks crop up to the outer 10% per edge -->
  <rect width="512" height="512" fill="#1a1a1a"/>
  <!-- Artwork stays inside the inner 80% safe-zone circle (r <= 204 from center) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="rgba(100,180,255,0.22)" stroke-width="6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(100,180,255,0.34)" stroke-width="6"/>
  <circle cx="256" cy="256" r="96" fill="url(#marble)" stroke="rgba(0,0,0,0.3)" stroke-width="3"/>
</svg>
